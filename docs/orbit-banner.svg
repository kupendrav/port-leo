<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">KVR • Orbit — Space-Themed Portfolio</title>
  <desc id="desc">Animated starfield with an orbiting planet and metallic chrome heading</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="45%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="18%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="82%" cy="70%" r="38%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="18%" stop-color="#d7dee8"/>
      <stop offset="36%" stop-color="#ffffff"/>
      <stop offset="54%" stop-color="#9aa7b8"/>
      <stop offset="72%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#7f8b9a"/>
    </linearGradient>
    <linearGradient id="chromeStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ec8ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffb25c"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#space)"/>
  <rect width="1280" height="320" fill="url(#nebulaA)"/>
  <rect width="1280" height="320" fill="url(#nebulaB)"/>

  <!-- Starfield -->
  <g fill="#eaf4ff">
    <circle cx="48" cy="42" r="1.2"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="112" cy="88" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="176" cy="36" r="1.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="128" r="1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="58" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="388" cy="168" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="44" r="1.1"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="96" r="1.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="28" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="702" cy="140" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="64" r="1"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="858" cy="188" r="1.3"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="40" r="1.1"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1008" cy="112" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1086" cy="72" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1164" cy="154" r="1.2"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="48" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="86" cy="210" r="1.1"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="198" cy="248" r="1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="354" cy="276" r="1.3"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="512" cy="238" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="688" cy="268" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="864" cy="252" r="1"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="286" r="1.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1198" cy="230" r="1"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Orbiting planet -->
  <g transform="translate(1120 86)">
    <ellipse cx="0" cy="0" rx="58" ry="18" fill="none" stroke="#7ec8ff" stroke-opacity="0.45" stroke-width="1.2" transform="rotate(-18)"/>
    <circle r="16" fill="#12345a" stroke="#8ecbff" stroke-width="1.4">
      <animate attributeName="cx" values="52;0;-52;0;52" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-8;16;-8;-16;-8" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#fdeb71">
      <animate attributeName="cx" values="-52;0;52;0;-52" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="8;-16;8;16;8" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting stars -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <line x1="180" y1="40" x2="214" y2="58" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-140,70" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="980" y1="70" x2="1016" y2="88" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-160,80" dur="5s" begin="1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Metallic heading -->
  <g filter="url(#softGlow)" text-anchor="middle">
    <text x="640" y="148" font-family="Orbitron, Space Grotesk, Segoe UI, sans-serif" font-size="64" font-weight="800" letter-spacing="8" fill="url(#chrome)" stroke="url(#chromeStroke)" stroke-width="1.2">
      KVR • ORBIT
    </text>
    <text x="640" y="196" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" letter-spacing="6" fill="#9db8d4">
      SPACE-THEMED PORTFOLIO
    </text>
  </g>
</svg>
